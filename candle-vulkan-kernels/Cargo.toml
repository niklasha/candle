[package]
name = "candle-vulkan-kernels"
version = "0.9.0-alpha.1"
edition = "2021"

description = "Vulkan kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"


[dependencies]
once_cell = "1.21.3"
shaderc = "0.8.3"
thiserror = "2.0.12"
tracing = "0.1.41"
vulkano = { version = "0.35.1" }

[dev-dependencies]
clap = { version = "4.2.4", features = ["derive"] }
half = { version = "2.3.1", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
anyhow = "1"
rand = "0.9.0"
rand_distr = "0.5.1"
